name: Terraform Import and Generate Code

on:
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  terraform-generate:
    name: Generate Code & Import
    runs-on: ubuntu-latest
    
    # Required permissions for OIDC token request and pushing the generated file back to repo
    permissions:
      id-token: write
      contents: write

    defaults:
      run:
        working-directory: environment/uat

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Terraform CLI
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 3. Azure Login using your OIDC setup with repository variables
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # 4. Initialize Terraform
      - name: Terraform Init
        run: terraform init

      # 5. Run Plan with Code Generation
      - name: Terraform Plan & Generate Code
        run: |
          terraform plan \
            -generate-config-out=generated_resources.tf \
            -var-file="uat.tfvars" \
            -out=tfplan

      # 6. Apply the import to bind the resources to state
      - name: Terraform Apply Import
        run: terraform apply -auto-approve tfplan

      # 7. Automatically commit the generated file back to your branch
      - name: Commit Generated Code
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-generated Terraform code from existing Azure resources"
          file_pattern: environment/uat/generated_resources.tf
