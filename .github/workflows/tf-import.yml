name: Terraform Import and Generate Code

on:
  workflow_dispatch: # Allows you to manually trigger this from the Actions tab

jobs:
  terraform-generate:
    name: Generate Code & Import
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: environment/uat

    steps:
      # 1. Checkout your repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Terraform CLI
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 3. Authenticate to Azure (Requires Azure Credentials stored in GitHub Secrets)
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 4. Initialize Terraform
      - name: Terraform Init
        run: terraform init

      # 5. Run Plan with Code Generation
      - name: Terraform Plan & Generate Code
        run: |
          terraform plan \
            -generate-config-out=generated_resources.tf \
            -var-file="uat.tfvars" \
            -out=tfplan

      # 6. (Optional) Apply the import so it enters state management
      - name: Terraform Apply Import
        run: terraform apply -auto-approve tfplan

      # 7. Commit and Push the generated file back to GitHub
      - name: Commit Generated Code
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-generated Terraform code from existing Azure resources"
          file_pattern: environment/uat/generated_resources.tf
