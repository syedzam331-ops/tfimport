name: "Terraform UAT Deployment"

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Select Terraform Action'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: "Terraform Execution"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./environment/uat

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init
        env:
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"
          ARM_USE_AZUREAD_AUTH: "true"
        run: terraform init

      - name: Terraform Plan
        if: ${{ inputs.action == 'plan' }}
        env:
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"
          ARM_USE_AZUREAD_AUTH: "true"
          TF_VAR_linux_ssh_public_key: ${{ secrets.LINUX_SSH_PUBLIC_KEY }}
          TF_VAR_windows_admin_password: ${{ secrets.WINDOWS_ADMIN_PASSWORD }}
          TF_VAR_sql_aad_admin_login: ${{ secrets.SQL_AAD_ADMIN_LOGIN }}
          TF_VAR_sql_aad_admin_object_id: ${{ secrets.SQL_AAD_ADMIN_OBJECT_ID }}
        run: terraform plan -var-file="uat.tfvars" -input=false

      - name: Terraform Apply
        if: ${{ inputs.action == 'apply' }}
        env:
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"
          ARM_USE_AZUREAD_AUTH: "true"
          TF_VAR_linux_ssh_public_key: ${{ secrets.LINUX_SSH_PUBLIC_KEY }}
          TF_VAR_windows_admin_password: ${{ secrets.WINDOWS_ADMIN_PASSWORD }}
          TF_VAR_sql_aad_admin_login: ${{ secrets.SQL_AAD_ADMIN_LOGIN }}
          TF_VAR_sql_aad_admin_object_id: ${{ secrets.SQL_AAD_ADMIN_OBJECT_ID }}
        run: terraform apply -var-file="uat.tfvars" -auto-approve -input=false

      - name: Terraform Destroy
        if: ${{ inputs.action == 'destroy' }}
        env:
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"
          ARM_USE_AZUREAD_AUTH: "true"
          TF_VAR_linux_ssh_public_key: ${{ secrets.LINUX_SSH_PUBLIC_KEY }}
          TF_VAR_windows_admin_password: ${{ secrets.WINDOWS_ADMIN_PASSWORD }}
          TF_VAR_sql_aad_admin_login: ${{ secrets.SQL_AAD_ADMIN_LOGIN }}
          TF_VAR_sql_aad_admin_object_id: ${{ secrets.SQL_AAD_ADMIN_OBJECT_ID }}
        run: terraform destroy -var-file="uat.tfvars" -auto-approve -input=false
